<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Груминг — таймер действий</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Груминг">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
  :root{
    --bg:#0d1016; --panel:#1b2029; --panel2:#232a35; --line:#2a3341;
    --text:#e8edf5; --muted:#8b97a8;
    --accent:#4c8dff; --ok:#2fbf71; --bad:#e5484d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 100px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1d2634, #0d1016 60%);
    color:var(--text); min-height:100vh;
    padding-top:calc(24px + env(safe-area-inset-top));
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
  }
  .app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0;font-weight:600}
  h2 .accent{color:var(--accent)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:var(--panel2);color:var(--text);transition:.15s}
  button:hover{filter:brightness(1.18)}
  button:active{transform:scale(.98)}
  .primary{background:var(--accent);color:#fff}
  .danger{background:#3a2226;color:#ff8b8f}
  .ghost{background:transparent;border:1px solid #37414f;color:var(--muted)}
  .hint{color:var(--muted);font-size:14px;margin:8px 0 0}

  /* породы — выпадающий список */
  .breed-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dropdown{position:relative;flex:1;min-width:200px}
  .dd-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel2);border:1px solid #37414f;color:var(--text);
    padding:12px 16px;border-radius:12px;font:inherit;cursor:pointer;
    text-align:left;transition:.15s;
  }
  .dd-toggle:hover{border-color:#4a5568;filter:none}
  .dd-toggle .dd-current{
    display:flex;align-items:center;gap:10px;min-width:0;flex:1;
  }
  .dd-toggle .dd-name{
    font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dd-toggle .dd-count{
    color:var(--muted);font-size:12px;white-space:nowrap;
  }
  .dd-toggle .dd-arrow{
    color:var(--muted);font-size:12px;transition:.2s;
    transform:rotate(0deg);
  }
  .dropdown.open .dd-toggle{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,141,255,.15)}
  .dropdown.open .dd-arrow{transform:rotate(180deg);color:var(--accent)}

  .dd-menu{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    background:#1e242e;border:1px solid var(--line);border-radius:12px;
    padding:6px;z-index:50;
    box-shadow:0 16px 40px rgba(0,0,0,.55);
    max-height:320px;overflow-y:auto;
    display:none;
  }
  .dropdown.open .dd-menu{display:block}
  .dd-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:8px;cursor:pointer;
    transition:.1s;
  }
  .dd-item:hover{background:#2a3341}
  .dd-item.active{background:#243046;color:#9dc0ff}
  .dd-item .dd-i-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-item.active .dd-i-name{font-weight:600}
  .dd-item .dd-i-count{
    font-size:12px;color:var(--muted);white-space:nowrap;
    background:rgba(0,0,0,.25);padding:2px 8px;border-radius:99px;
  }
  .dd-item.active .dd-i-count{color:#9dc0ff;background:rgba(76,141,255,.15)}
  .dd-item .dd-i-tools{display:flex;gap:2px}
  .dd-item .dd-i-tools button{
    padding:4px 7px;background:transparent;color:var(--muted);
    font-size:12px;border-radius:6px;
  }
  .dd-item .dd-i-tools button:hover{background:#3a4557;color:#fff}

  .add-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .add-form input{
    font:inherit;background:#12161e;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;outline:none;
  }
  .add-form input:focus{border-color:var(--accent)}
  #actName{flex:1;min-width:160px}
  .time-inputs{display:flex;align-items:center;gap:4px;color:var(--muted)}
  .time-inputs input{width:66px;text-align:center}
  .time-inputs input::-webkit-outer-spin-button,
  .time-inputs input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .lib-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .lib-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 10px 8px 14px}
  .lib-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lib-item .plan{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .lib-item .tools{display:flex;gap:2px}
  .lib-item .tools button{padding:6px 9px;background:transparent;color:var(--muted);font-size:13px;border-radius:8px}
  .lib-item .tools button:hover{background:#2f3948;color:#fff}

  .current{background:#141a24;border:1px solid #2b3546;border-radius:14px;padding:18px;text-align:center}
  .cur-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
  .badge{background:#243046;color:#9dc0ff;padding:4px 10px;border-radius:99px;font-size:12px}
  .cur-name{font-size:20px;font-weight:600;margin-bottom:6px}
  .cur-timer{font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1.1}
  .cur-timer.over{color:var(--bad)}
  .cur-controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

  .sess-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .sess-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
             background:var(--panel2);font-size:14px;border-left:4px solid #37414f}
  .sess-item .num{color:var(--muted);width:18px;font-variant-numeric:tabular-nums}
  .sess-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess-item .vals{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sess-item.ok{border-left-color:var(--ok);background:#15271e}
  .sess-item.ok .vals{color:var(--ok)}
  .sess-item.over{border-left-color:var(--bad);background:#2a191b}
  .sess-item.over .vals{color:var(--bad)}
  .sess-item.active{border-left-color:var(--accent);background:#192335}
  .sess-item.active .vals{color:#9dc0ff}

  .summary{margin-top:16px;padding:20px 16px;border-radius:14px;text-align:center;font-size:15px}
  .summary.good{background:#15271e;border:1px solid var(--ok);color:var(--ok)}
  .summary.bad{background:#2a191b;border:1px solid var(--bad);color:#ff9a9d}
  .summary b{font-size:22px;display:block;margin-bottom:4px}

  .summary .breed-name{
    margin-top:8px;
    font-size:16px;
    font-weight:700;
    letter-spacing:.4px;
    color:#9dc0ff;
    text-transform:uppercase;
  }

  .summary .line{
    margin-top:10px;
    font-size:20px;
    font-weight:600;
    letter-spacing:.2px;
    color:var(--text);
    font-variant-numeric:tabular-nums;
    line-height:1.4;
  }
  .summary .line .lbl{
    color:var(--muted);
    font-weight:500;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .summary .line .val{
    font-weight:700;
    font-size:21px;
    color:#fff;
  }
  .summary.good .line .val{color:#b8ffd0}
  .summary.bad .line .val{color:#ffc2c4}
  .summary .line .sep{
    color:var(--muted);opacity:.5;margin:0 8px;
  }

  .summary .praise{
    margin-top:12px;
    font-size:17px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.3px;
    padding:10px 14px;
    border-radius:10px;
    background:rgba(47,191,113,.15);
    border:1px dashed var(--ok);
    color:#8fffb3;
  }
  .summary .shame{
    margin-top:12px;
    font-size:17px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.3px;
    padding:10px 14px;
    border-radius:10px;
    background:rgba(229,72,77,.15);
    border:1px dashed var(--bad);
    color:#ff9a9d;
  }

  #installBtn{
    position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%;
    transform:translateX(-50%); display:none; padding:13px 24px; border-radius:99px;
    border:none; background:var(--accent); color:#fff; font:600 15px system-ui,sans-serif;
    box-shadow:0 10px 28px rgba(76,141,255,.45); cursor:pointer; z-index:99;
  }
  #installBtn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>✂️ Груминг — таймер действий</h1>
    <div class="sub">Обратный отсчёт. Уложился в план — зелёный, вышел за план — красный.</div>
  </header>

  <section class="panel">
    <div class="panel-head">
      <h2>Порода</h2>
      <button id="addBreedBtn" class="primary">+ Порода</button>
    </div>

    <div class="breed-bar">
      <div id="dropdown" class="dropdown">
        <button type="button" id="ddToggle" class="dd-toggle">
          <span class="dd-current">
            <span class="dd-name" id="ddName">—</span>
            <span class="dd-count" id="ddCount"></span>
          </span>
          <span class="dd-arrow">▼</span>
        </button>
        <div id="ddMenu" class="dd-menu"></div>
      </div>
    </div>
    <p class="hint">Нажмите на кнопку — откроется список пород. Внутри списка: ✎ — переименовать, ✕ — удалить.</p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Библиотека: <span class="accent" id="breedLabel">—</span></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" id="resetBtn" class="ghost">↺ Сбросить к стандарту</button>
        <button type="button" id="presetBtn" class="ghost">Загрузить пример</button>
      </div>
    </div>

    <form id="addForm" class="add-form" autocomplete="off">
      <input id="actName" type="text" placeholder="Название действия">
      <div class="time-inputs">
        <input id="actMin" type="number" min="0" max="599" placeholder="мин">
        <span>:</span>
        <input id="actSec" type="number" min="0" max="59" placeholder="сек">
      </div>
      <button type="submit" id="addBtn" class="primary">Добавить</button>
      <button type="button" id="cancelEditBtn" class="ghost" hidden>Отмена</button>
    </form>

    <ul id="libList" class="lib-list"></ul>
    <p id="libEmpty" class="hint">Пока пусто — добавьте первое действие или загрузите пример.</p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Выполнение</h2>
      <button id="startBtn" class="primary">▶ Начать сеанс</button>
    </div>
    <div id="sessionArea"></div>
  </section>

</div>

<button id="installBtn">⬇ Установить на телефон</button>

<script>
(function(){
  "use strict";

  const LS_KEY     = 'grooming_breeds_v2';
  const LS_OLD_KEY = 'grooming_timer_library_v1';

  const PRESET = [
    { name: 'Осмотр / подготовка', planned: 3 * 60 },
    { name: 'Купание',              planned: 10 * 60 },
    { name: 'Сушка',                planned: 15 * 60 },
    { name: 'Стрижка корпуса',      planned: 25 * 60 },
    { name: 'Стрижка морды',        planned: 10 * 60 },
    { name: 'Лапы',                 planned: 7 * 60 },
    { name: 'Когти',                planned: 5 * 60 },
    { name: 'Уши',                  planned: 4 * 60 },
    { name: 'Финал / фото',         planned: 3 * 60 }
  ];

  const DEFAULT_LIBRARIES = {
    'Шпиц': [
      { name: 'Осмотр / подготовка',       planned: 3 * 60 },
      { name: 'Купание',                   planned: 10 * 60 },
      { name: 'Сушка (фен + компрессор)',  planned: 20 * 60 },
      { name: 'Вычёсывание',               planned: 15 * 60 },
      { name: 'Стрижка корпуса',           planned: 20 * 60 },
      { name: 'Стрижка морды',             planned: 8 * 60 },
      { name: 'Лапы',                      planned: 5 * 60 },
      { name: 'Когти',                     planned: 5 * 60 },
      { name: 'Уши',                       planned: 4 * 60 },
      { name: 'Финал / фото',              planned: 3 * 60 }
    ],
    'Йорк': [
      { name: 'Осмотр / подготовка',       planned: 2 * 60 },
      { name: 'Купание',                   planned: 7 * 60 },
      { name: 'Сушка',                     planned: 10 * 60 },
      { name: 'Вычёсывание',               planned: 8 * 60 },
      { name: 'Стрижка корпуса',           planned: 20 * 60 },
      { name: 'Стрижка морды',             planned: 10 * 60 },
      { name: 'Лапы',                      planned: 5 * 60 },
      { name: 'Когти',                     planned: 4 * 60 },
      { name: 'Уши',                       planned: 4 * 60 },
      { name: 'Финал / фото',              planned: 3 * 60 }
    ],
    'Пудель': [
      { name: 'Осмотр / подготовка',       planned: 4 * 60 },
      { name: 'Купание',                   planned: 15 * 60 },
      { name: 'Сушка',                     planned: 25 * 60 },
      { name: 'Вычёсывание',               planned: 15 * 60 },
      { name: 'Стрижка корпуса',           planned: 30 * 60 },
      { name: 'Стрижка морды',             planned: 12 * 60 },
      { name: 'Лапы',                      planned: 8 * 60 },
      { name: 'Когти',                     planned: 6 * 60 },
      { name: 'Уши',                       planned: 5 * 60 },
      { name: 'Финал / фото',              planned: 4 * 60 }
    ]
  };

  const PRAISES = [
    '🔥 Красавчег, можешь просить 50%!',
    '👏 Ай молодца!',
    '✨ То ли ты супер, то ли питомец идеальный!',
    '🏆 Ну ты топ грумер прям!'
  ];

  const SHAMES = [
    '😅 Грумер года блин!!!',
    '🤔 А кто этооо сдееелал???',
    '💆 Отвлеку клиента, работай.',
    '🐕 Ты уже вторую собаку достриг? А, нет, первую...',
    '🧘 Ты решил, что груминг — это медитация?',
    '🎨 Скажи клиенту, что ты художник, тебя торопить нельзя.'
  ];

  const $ = id => document.getElementById(id);
  const dropdown    = $('dropdown');
  const ddToggle    = $('ddToggle');
  const ddName      = $('ddName');
  const ddCount     = $('ddCount');
  const ddMenu      = $('ddMenu');
  const addBreedBtn = $('addBreedBtn');
  const breedLabel  = $('breedLabel');
  const libList     = $('libList');
  const libEmpty    = $('libEmpty');
  const addForm     = $('addForm');
  const actName     = $('actName');
  const actMin      = $('actMin');
  const actSec      = $('actSec');
  const addBtn      = $('addBtn');
  const cancelEditBtn = $('cancelEditBtn');
  const startBtn    = $('startBtn');
  const sessionArea = $('sessionArea');
  const presetBtn   = $('presetBtn');
  const resetBtn    = $('resetBtn');

  let state = { activeId: null, breeds: [] };
  let editingId = null;
  let session = null;
  let tickId = null;

  const uid = () => Math.random().toString(36).slice(2, 9);

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }

  function fmt(ms){
    if (ms == null || isNaN(ms)) return '--:--';
    const neg = ms < 0;
    let t = Math.floor(Math.abs(ms) / 1000);
    const h = Math.floor(t / 3600); t %= 3600;
    const m = Math.floor(t / 60);
    const s = t % 60;
    const p = n => String(n).padStart(2, '0');
    return (neg ? '−' : '') + (h > 0 ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`);
  }

  function plural(n){
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'действие';
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'действия';
    return 'действий';
  }

  function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function makeItems(list){
    return list.map(p => ({ id: uid(), name: p.name, planned: p.planned }));
  }

  function defaultItemsFor(name){
    const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').trim();
    const key = Object.keys(DEFAULT_LIBRARIES).find(k => norm(k) === norm(name));
    const src = key ? DEFAULT_LIBRARIES[key] : PRESET;
    return makeItems(src);
  }

  function saveState(){
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  }

  function loadState(){
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.breeds) && parsed.breeds.length){
          state = parsed;
          if (!state.breeds.find(b => b.id === state.activeId)){
            state.activeId = state.breeds[0].id;
          }
          return;
        }
      }
    } catch(e){ /* ignore */ }

    let migratedItems = [];
    try {
      const oldRaw = localStorage.getItem(LS_OLD_KEY);
      if (oldRaw){
        const old = JSON.parse(oldRaw);
        if (Array.isArray(old)){
          migratedItems = old.map(x => ({
            id: x.id || uid(),
            name: x.name,
            planned: x.planned
          }));
        }
      }
    } catch(e){ /* ignore */ }

    state = {
      activeId: null,
      breeds: Object.keys(DEFAULT_LIBRARIES).map(name => {
        const useMigrated = migratedItems.length && name === 'Шпиц';
        return {
          id: uid(),
          name,
          items: useMigrated ? migratedItems : makeItems(DEFAULT_LIBRARIES[name])
        };
      })
    };
    state.activeId = state.breeds[0].id;
    saveState();
  }

  function getBreed(){
    let b = state.breeds.find(x => x.id === state.activeId);
    if (!b){
      b = state.breeds[0];
      state.activeId = b.id;
    }
    return b;
  }

  function renderDropdown(){
    const cur = getBreed();

    ddName.textContent = cur.name;
    ddCount.textContent = `${cur.items.length} ${plural(cur.items.length)}`;

    ddMenu.innerHTML = '';
    state.breeds.forEach(b => {
      const item = document.createElement('div');
      item.className = 'dd-item' + (b.id === state.activeId ? ' active' : '');
      item.dataset.id = b.id;
      item.innerHTML =
        `<span class="dd-i-name">${esc(b.name)}</span>
         <span class="dd-i-count">${b.items.length}</span>
         <span class="dd-i-tools">
           <button type="button" data-act="edit" title="Переименовать">✎</button>
           <button type="button" data-act="del"  title="Удалить">✕</button>
         </span>`;
      ddMenu.appendChild(item);
    });
  }

  ddToggle.addEventListener('click', e => {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });

  ddMenu.addEventListener('click', e => {
    const item = e.target.closest('.dd-item');
    if (!item) return;
    const id = item.dataset.id;
    const btn = e.target.closest('button');
    const act = btn ? btn.dataset.act : null;

    if (act === 'edit'){
      e.stopPropagation();
      const b = state.breeds.find(x => x.id === id);
      if (!b) return;
      const name = prompt('Новое название породы:', b.name);
      if (name == null) return;
      const trimmed = name.trim();
      if (!trimmed) return;
      b.name = trimmed;
      saveState();
      renderDropdown();
      if (state.activeId === id) renderLibrary();
      return;
    }

    if (act === 'del'){
      e.stopPropagation();
      if (state.breeds.length <= 1){
        alert('Нельзя удалить последнюю породу.');
        return;
      }
      const b = state.breeds.find(x => x.id === id);
      if (!confirm(`Удалить породу «${b.name}» вместе с её библиотекой?`)) return;
      state.breeds = state.breeds.filter(x => x.id !== id);
      if (state.activeId === id) state.activeId = state.breeds[0].id;
      if (session){ stopTick(); session = null; }
      saveState();
      renderDropdown();
      renderLibrary();
      renderSession();
      return;
    }

    if (id === state.activeId){
      dropdown.classList.remove('open');
      return;
    }
    if (session && !confirm('Идёт сеанс. Переключить породу и прервать сеанс?')) return;
    if (session){ stopTick(); session = null; }
    state.activeId = id;
    resetForm();
    saveState();
    dropdown.classList.remove('open');
    renderDropdown();
    renderLibrary();
    renderSession();
  });

  document.addEventListener('click', e => {
    if (!dropdown.contains(e.target)){
      dropdown.classList.remove('open');
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') dropdown.classList.remove('open');
  });

  addBreedBtn.addEventListener('click', () => {
    const name = prompt('Название новой породы:');
    if (name == null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    const b = { id: uid(), name: trimmed, items: defaultItemsFor(trimmed) };
    state.breeds.push(b);
    state.activeId = b.id;
    resetForm();
    saveState();
    renderDropdown();
    renderLibrary();
    renderSession();
  });

  function renderLibrary(){
    const breed = getBreed();
    breedLabel.textContent = breed.name;
    libList.innerHTML = '';
    breed.items.forEach((a, i) => {
      const li = document.createElement('li');
      li.className = 'lib-item';
      li.innerHTML =
        `<span class="nm">${esc(a.name)}</span>
         <span class="plan">${fmt(a.planned * 1000)}</span>
         <span class="tools">
           <button type="button" data-act="up"   data-i="${i}" title="Выше">▲</button>
           <button type="button" data-act="down" data-i="${i}" title="Ниже">▼</button>
           <button type="button" data-act="edit" data-i="${i}" title="Изменить">✎</button>
           <button type="button" data-act="del"  data-i="${i}" title="Удалить">✕</button>
         </span>`;
      libList.appendChild(li);
    });
    libEmpty.hidden = breed.items.length > 0;
  }

  libList.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const breed = getBreed();
    const i = Number(btn.dataset.i);
    const act = btn.dataset.act;

    if (act === 'up' && i > 0){
      [breed.items[i-1], breed.items[i]] = [breed.items[i], breed.items[i-1]];
    } else if (act === 'down' && i < breed.items.length - 1){
      [breed.items[i+1], breed.items[i]] = [breed.items[i], breed.items[i+1]];
    } else if (act === 'edit'){
      const a = breed.items[i];
      editingId = a.id;
      actName.value = a.name;
      actMin.value = Math.floor(a.planned / 60) || '';
      actSec.value = a.planned % 60 || '';
      addBtn.textContent = 'Сохранить';
      cancelEditBtn.hidden = false;
      actName.focus();
      return;
    } else if (act === 'del'){
      if (!confirm('Удалить действие «' + breed.items[i].name + '»?')) return;
      if (editingId === breed.items[i].id) resetForm();
      breed.items.splice(i, 1);
    } else {
      return;
    }
    saveState();
    renderLibrary();
    renderDropdown();
  });

  function resetForm(){
    editingId = null;
    addForm.reset();
    addBtn.textContent = 'Добавить';
    cancelEditBtn.hidden = true;
  }

  cancelEditBtn.addEventListener('click', () => { resetForm(); actName.focus(); });

  addForm.addEventListener('submit', e => {
    e.preventDefault();
    const breed = getBreed();
    const name = actName.value.trim();
    if (!name) { actName.focus(); return; }
    const mins = parseInt(actMin.value, 10) || 0;
    const secs = parseInt(actSec.value, 10) || 0;
    const planned = mins * 60 + secs;
    if (planned <= 0) { alert('Укажите плановое время (мин и/или сек).'); return; }

    if (editingId){
      const a = breed.items.find(x => x.id === editingId);
      if (a){ a.name = name; a.planned = planned; }
      resetForm();
    } else {
      breed.items.push({ id: uid(), name, planned });
      actName.value = ''; actMin.value = ''; actSec.value = '';
    }
    saveState();
    renderLibrary();
    renderDropdown();
    actName.focus();
  });

  presetBtn.addEventListener('click', () => {
    const breed = getBreed();
    if (breed.items.length && !confirm(`Заменить библиотеку «${breed.name}» универсальным примером?`)) return;
    breed.items = makeItems(PRESET);
    resetForm();
    saveState();
    renderLibrary();
    renderDropdown();
  });

  resetBtn.addEventListener('click', () => {
    const breed = getBreed();
    const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').trim();
    const key = Object.keys(DEFAULT_LIBRARIES).find(k => norm(k) === norm(breed.name));
    if (!key){
      alert(`Для породы «${breed.name}» нет стандартного набора.\nИспользуйте «Загрузить пример» или добавьте действия вручную.`);
      return;
    }
    if (!confirm(`Сбросить библиотеку «${breed.name}» к стандартному набору? Ваши изменения будут потеряны.`)) return;
    breed.items = makeItems(DEFAULT_LIBRARIES[key]);
    resetForm();
    saveState();
    renderLibrary();
    renderDropdown();
  });

  function elapsedMs(it){
    if (it.status !== 'active') return it.actual || 0;
    const now = it.paused ? it.pauseStart : Date.now();
    return now - it.startTime - it.pausedTotal;
  }
  function remainingMs(it){
    return it.planned - elapsedMs(it);
  }

  function startSession(){
    const breed = getBreed();
    if (!breed.items.length){
      alert(`В библиотеке породы «${breed.name}» пока нет действий. Добавьте хотя бы одно.`);
      return;
    }
    session = {
      breedName: breed.name,
      items: breed.items.map(a => ({
        name: a.name,
        planned: a.planned * 1000,
        actual: null,
        status: 'pending',
        startTime: 0,
        pausedTotal: 0,
        paused: false,
        pauseStart: 0
      })),
      index: 0,
      finished: false
    };
    beginItem(0);
  }

  function beginItem(i){
    const it = session.items[i];
    it.status = 'active';
    it.startTime = Date.now();
    it.pausedTotal = 0;
    it.paused = false;
    it.pauseStart = 0;
    session.index = i;
    startTick();
    renderSession();
  }

  function startTick(){
    if (tickId) clearInterval(tickId);
    tickId = setInterval(() => {
      if (!session || session.finished) return;
      const it = session.items[session.index];
      if (!it || it.status !== 'active') return;
      const el = $('curTimer');
      if (!el) return;
      const rem = remainingMs(it);
      el.textContent = fmt(rem);
      el.classList.toggle('over', rem < 0);
    }, 200);
  }

  function stopTick(){
    if (tickId){ clearInterval(tickId); tickId = null; }
  }

  function finishCurrent(){
    if (!session || session.finished) return;
    const it = session.items[session.index];
    it.actual = elapsedMs(it);
    it.paused = false;
    it.status = it.actual <= it.planned ? 'ok' : 'over';

    if (session.index + 1 < session.items.length){
      beginItem(session.index + 1);
    } else {
      session.finished = true;
      stopTick();
      renderSession();
    }
  }

  function togglePause(){
    if (!session || session.finished) return;
    const it = session.items[session.index];
    if (!it || it.status !== 'active') return;
    if (it.paused){
      it.pausedTotal += Date.now() - it.pauseStart;
      it.paused = false;
    } else {
      it.paused = true;
      it.pauseStart = Date.now();
    }
    renderSession();
  }

  function endSession(){
    stopTick();
    session = null;
    renderSession();
  }

  function sessItemHtml(it, i){
    let vals;
    if (it.status === 'pending'){
      vals = `план ${fmt(it.planned)}`;
    } else if (it.status === 'active'){
      const rem = remainingMs(it);
      vals = rem >= 0
        ? `осталось ${fmt(rem)}`
        : `<b>перебор ${fmt(Math.abs(rem))}</b>`;
    } else {
      const diff = it.actual - it.planned;
      vals = `план ${fmt(it.planned)} · факт ${fmt(it.actual)} · ` +
             `<b>${diff <= 0 ? '−' : '+'}${fmt(Math.abs(diff))}</b>`;
    }
    return `<li class="sess-item ${it.status}">
              <span class="num">${i + 1}</span>
              <span class="nm">${esc(it.name)}</span>
              <span class="vals">${vals}</span>
            </li>`;
  }

  function renderSession(){
    startBtn.hidden = !!session;

    if (!session){
      const breed = getBreed();
      sessionArea.innerHTML = `<p class="hint">Порода: <b>${esc(breed.name)}</b>. Нажмите «Начать сеанс» — пойдёт обратный отсчёт по каждому действию. Кнопка «Готово» фиксирует время и сразу запускает следующее действие.</p>`;
      return;
    }

    let html = '';

    if (!session.finished){
      const it = session.items[session.index];
      const rem = remainingMs(it);
      html += `
        <div class="current">
          <div class="cur-top">
            <span class="badge">${esc(session.breedName)} · Шаг ${session.index + 1} из ${session.items.length}</span>
            <span>План: ${fmt(it.planned)}</span>
          </div>
          <div class="cur-name">${esc(it.name)}</div>
          <div class="cur-timer${rem < 0 ? ' over' : ''}" id="curTimer">${fmt(rem)}</div>
          <div class="cur-controls">
            <button type="button" id="pauseBtn" class="ghost">${it.paused ? '▶ Продолжить' : '⏸ Пауза'}</button>
            <button type="button" id="doneBtn" class="primary">Готово →</button>
            <button type="button" id="abortBtn" class="danger">Отменить сеанс</button>
          </div>
        </div>`;
    } else {
      const tp = session.items.reduce((s, i) => s + i.planned, 0);
      const ta = session.items.reduce((s, i) => s + (i.actual || 0), 0);
      const okCount = session.items.filter(i => i.status === 'ok').length;
      const overCount = session.items.filter(i => i.status === 'over').length;
      const total = session.items.length;

      const allGreen = okCount === total;
      const halfOrMoreRed = overCount >= Math.ceil(total / 2);

      const diff = ta - tp;
      const good = diff <= 0;

      let extra = '';
      if (allGreen) extra = `<div class="praise">${esc(pick(PRAISES))}</div>`;
      else if (halfOrMoreRed) extra = `<div class="shame">${esc(pick(SHAMES))}</div>`;

      html += `
        <div class="summary ${good ? 'good' : 'bad'}">
          <b>${good ? '✓ Уложились в план' : '✕ Вышли за план'} ${diff <= 0 ? '−' : '+'}${fmt(Math.abs(diff))}</b>
          <div class="breed-name">${esc(session.breedName)}</div>
          <div class="line">
            <span class="lbl">План</span> <span class="val">${fmt(tp)}</span>
            <span class="sep">·</span>
            <span class="lbl">Факт</span> <span class="val">${fmt(ta)}</span>
            <span class="sep">·</span>
            <span class="lbl">В норме</span> <span class="val">${okCount} из ${total}</span>
          </div>
          ${extra}
        </div>
        <div class="cur-controls">
          <button type="button" id="restartBtn" class="primary">↻ Новый сеанс</button>
          <button type="button" id="closeSession" class="ghost">Закрыть</button>
        </div>`;
    }

    html += '<ul class="sess-list">' +
            session.items.map((it, i) => sessItemHtml(it, i)).join('') +
            '</ul>';

    sessionArea.innerHTML = html;
  }

  sessionArea.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    switch (btn.id){
      case 'pauseBtn':     togglePause(); break;
      case 'doneBtn':      finishCurrent(); break;
      case 'abortBtn':     if (confirm('Отменить текущий сеанс? Результаты не сохранятся.')) endSession(); break;
      case 'closeSession': endSession(); break;
      case 'restartBtn':   startSession(); break;
    }
  });

  startBtn.addEventListener('click', startSession);

  loadState();
  renderDropdown();
  renderLibrary();
  renderSession();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('SW не зарегистрирован:', err);
      });
    });
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('Установка:', outcome);
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });
</script>

</body>
</html>
